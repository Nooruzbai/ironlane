<a href="{% url 'quote' %}?service={{ slug }}" class="reveal service-card group" data-delay="{{ delay }}">
    <span class="service-icon">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7h11v9H3zM14 10h4l3 3v3h-7zM7 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM17 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></svg>
    </span>
    <h3 class="mt-6 text-xl font-semibold">{{ title }}</h3>
    <p class="mt-3 leading-relaxed text-steel-600">{{ text }}</p>
    <span class="mt-6 inline-flex items-center gap-1 text-sm font-semibold text-signal-dark">Get a rate <span class="transition-transform group-hover:translate-x-1">&rarr;</span></span>
</a>
