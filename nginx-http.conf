# Bootstrap config: plain HTTP, no TLS.
# Used before a Let's Encrypt certificate exists (NGINX_CONF=nginx-http.conf).
# Switch back to nginx.conf once certbot has issued the cert.
server {
    listen 80;
    server_name _;

    # Webroot for Let's Encrypt HTTP-01 challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
