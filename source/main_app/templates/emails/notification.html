<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ heading }}</title>
</head>
{# Email clients ignore <style> blocks and modern CSS, so everything is inline and table-based. #}
<body style="margin:0;padding:0;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:24px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0;">
        <tr>
          <td style="background:#0f172a;padding:20px 28px;border-bottom:3px solid #f59e0b;">
            <div style="font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#f59e0b;font-weight:bold;">{{ site_name }}</div>
            <div style="font-size:22px;font-weight:bold;color:#ffffff;margin-top:6px;">{{ heading }}</div>
            <div style="font-size:13px;color:#94a3b8;margin-top:4px;">{{ created_at|date:"d M Y, H:i" }} UTC</div>
          </td>
        </tr>

        <tr>
          <td style="padding:24px 28px 8px;">
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td style="padding-right:10px;">
                  <a href="mailto:{{ email }}" style="display:inline-block;background:#f59e0b;color:#0f172a;text-decoration:none;font-weight:bold;font-size:14px;padding:11px 20px;border-radius:8px;">Reply by email</a>
                </td>
                <td>
                  <a href="tel:{{ phone|cut:' ' }}" style="display:inline-block;background:#0f172a;color:#ffffff;text-decoration:none;font-weight:bold;font-size:14px;padding:11px 20px;border-radius:8px;">Call {{ phone }}</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td style="padding:16px 28px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-size:15px;">
              {% for label, value in rows %}
              <tr>
                <td style="padding:10px 0;border-bottom:1px solid #e2e8f0;color:#64748b;width:130px;vertical-align:top;">{{ label }}</td>
                <td style="padding:10px 0;border-bottom:1px solid #e2e8f0;font-weight:bold;">{{ value }}</td>
              </tr>
              {% endfor %}
            </table>
          </td>
        </tr>

        <tr>
          <td style="padding:8px 28px 24px;">
            <div style="font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#64748b;font-weight:bold;margin-bottom:8px;">Message</div>
            <div style="background:#f8fafc;border-left:3px solid #f59e0b;padding:14px 16px;font-size:15px;line-height:1.5;border-radius:4px;">
              {% if message %}{{ message|linebreaksbr }}{% else %}<span style="color:#94a3b8;">No message</span>{% endif %}
            </div>
          </td>
        </tr>

        <tr>
          <td style="padding:16px 28px;background:#f8fafc;border-top:1px solid #e2e8f0;font-size:13px;color:#64748b;">
            <a href="{{ admin_url }}" style="color:#b45309;font-weight:bold;">Open in admin</a> to mark it as handled.
            Replying to this email goes straight to {{ email }}.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
