# Bootstrap config: plain HTTP, no TLS.
# Used before a Let's Encrypt certificate exists (NGINX_CONF=nginx-http.conf).
# Switch back to nginx.conf once certbot has issued the cert.

# Rate limit POSTs to the public forms and the admin login (per client IP).
# GET requests map to an empty key, which nginx does not count.
map $request_method $post_client {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $post_client zone=post_forms:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Webroot for Let's Encrypt HTTP-01 challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
    }

    location ~ ^/(quote|careers|admin/login)/$ {
        limit_req zone=post_forms burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
