# Rate limit POSTs to the public forms and the admin login (per client IP).
# GET requests map to an empty key, which nginx does not count.
map $request_method $post_client {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $post_client zone=post_forms:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name it-cons.com www.it-cons.com;
    server_tokens off;

    # Let's Encrypt HTTP-01 challenges must stay on plain HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name it-cons.com www.it-cons.com;
    server_tokens off;

    # SSL Certificate Paths
    ssl_certificate /etc/letsencrypt/live/it-cons.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/it-cons.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
    }

    location ~ ^/(quote|careers|admin/login)/$ {
        limit_req zone=post_forms burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}