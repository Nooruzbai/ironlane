{% if messages %}
{% for message in messages %}
<div class="mb-8 flex items-start gap-3 rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-emerald-800" role="status">
    <span class="font-bold">&#10003;</span><p>{{ message }}</p>
</div>
{% endfor %}
{% endif %}
{% if errors %}
<div class="mb-8 rounded-xl border border-red-200 bg-red-50 p-4 text-red-800" role="alert">
    {% if errors.form %}{{ errors.form }}{% else %}Please fix the highlighted fields below.{% endif %}
</div>
{% endif %}
