server {
    listen 80;
    server_name it-cons.com www.it-cons.com;

    # Let's Encrypt HTTP-01 challenges must stay on plain HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name it-cons.com www.it-cons.com;

    # SSL Certificate Paths
    ssl_certificate /etc/letsencrypt/live/it-cons.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/it-cons.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}